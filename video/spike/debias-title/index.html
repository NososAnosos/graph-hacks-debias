<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #title {
        color: #f4f4f5;
        font-size: 128px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      #rule {
        width: 220px;
        height: 4px;
        margin: 20px 0 28px;
        background: #14b8a6;
        border-radius: 2px;
        transform-origin: left center;
      }
      #tagline {
        color: #f4f4f5;
        font-size: 36px;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1280"
      data-height="720"
    >
      <div id="stack" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="title" data-start="0" data-duration="5" data-track-index="1">Debias</h1>
        <div id="rule" data-start="0" data-duration="5" data-track-index="2"></div>
        <p id="tagline" data-start="0" data-duration="5" data-track-index="3">Memory you can audit.</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.4);
      tl.fromTo("#tagline", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0.5);
      tl.to("#stack", { opacity: 0, duration: 0.8, ease: "power1.in" }, 4.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
